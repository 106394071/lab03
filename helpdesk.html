<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="lab03">
    <meta name="keywords" content="HTML">
    <meta name="author" content="Pham Hung">
    <title>CWA Help Desk Appointment</title>
</head>

<body>
    <section>
        <a href="https://www.swin.edu.au/">
            <img src="logo.png" alt="swinburne-logo" width="100px">
        </a>
        <h1>CWA Help Desk Appointment</h1>
        <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday.</p>
        <p>Check Blackboard for when CWA tutors will be there.</p>
    </section>
    <form>
        <section>
            <fieldset>
                <legend>Student details</legend>
                <p>
                    <label for="id">Student ID</label>
                    <input type="text" id="id" name="id" required pattern="[0-9]{7,10}"
                        title="Student ID must be 7 to 10 digits">
                </p>
                <p>
                    <label for="givenname">Given Name</label>
                    <input type="text" id="givenname" name="givenname" required pattern="[A-Za-z]{1,15}"
                        title="Maximum 15 characters.">
                    <label for="familyname">Family Name</label>
                    <input type="text" id="familyname" name="familyname" required pattern="[A-Za-z]{1,15}"
                        title="Maximum 15 characters.">
                </p>
            </fieldset>
        </section>

        <section>
            <fieldset>
                <legend>Your unit</legend>
                <p>
                    <input type="radio" id="10011" name="unit" value="COS10011" required>
                    <label for="10011">COS10011</label>
                    <input type="radio" id="60004" name="unit" value="COS60004">
                    <label for="60004">COS60004</label>
                    <input type="radio" id="60007" name="unit" value="COS60007">
                    <label for="60007">COS60007</label>
                </p>
                <p>
                    <label for="tutor">Your Tutor</label>
                    <select name="tutor" id="tutor" required>
                        <option value="">Please Select</option>
                        <option value="tutor1">Tutor 1</option>
                        <option value="tutor2">Tutor 2</option>
                        <option value="tutor3">Tutor 3</option>
                    </select>
                </p>
            </fieldset>
        </section>

        <section>
            <fieldset>
                <legend>Issue</legend>
                <p>
                    <label for="issue">HTML</label>
                    <input type="checkbox" id="issue" name="issue" value="html" checked>
                    <label for="issue">CSS</label>
                    <input type="checkbox" id="issue" name="issue" value="css">
                    <label for="issue">JavaScript</label>
                    <input type="checkbox" id="issue" name="issue" value="javascript">
                    <label for="issue">PHP</label>
                    <input type="checkbox" id="issue" name="issue" value="php">
                    <label for="issue">MySQL</label>
                    <input type="checkbox" id="issue" name="issue" value="mysql">
                </p>
                <p>
                <div>
                    <label for="description">Description</label>
                </div>
                <textarea id="description" name="description"
                    placeholder="Write description of your issue here..."></textarea>
                </p>
            </fieldset>
        </section>

        <section>
            <fieldset>
                <legend>Preferred Date / Time</legend>
                <p> <!-- The difference was the format of two attributes making them incompatible -->
                    <label for="date">Date</label>
                    <input type="text" id="date" name="date" placeholder="dd/mm/yyyy" required
                        pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}" title="Date must be in the format dd/mm/yyyy">
                </p>
                <p>
                    <label for="time">Time</label>
                    <input type="text" id="time" name="time" placeholder="00:00" required pattern="[0-9]{2}:[0-9]{2}"
                        title="Time must be in the format 00:00">
                </p>
            </fieldset>
        </section>

        <section>
            <button type="submit">Book</button>
            <button type="reset">Reset form</button>
        </section>
    </form>
</body>

</html>
